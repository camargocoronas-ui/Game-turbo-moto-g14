          package com.gameturbo

          import android.content.Intent
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class TurboTile : TileService() {
              override fun onStartListening() = update()
              override fun onClick() {
                  if (TurboService.running) stopService(Intent(this, TurboService::class.java))
                  else {
                      val game = getSharedPreferences("turbo", MODE_PRIVATE).getString("game", null)
                      startForegroundService(Intent(this, TurboService::class.java).putExtra("game", game))
                  }
                  TurboService.running = !TurboService.running
                  update()
              }
              private fun update() {
                  qsTile?.apply { state = if (TurboService.running) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE; label = "Game Turbo"; updateTile() }
              }
          }
